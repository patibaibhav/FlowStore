# Serves the built React app and reverse-proxies the API + WebSocket to the backend container.
# The backend port (8000) is never published to the host; only this Nginx port is exposed.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;     # Parquet inspection / S3 listing can take a few seconds
    proxy_buffering off;         # stream Parquet downloads instead of buffering them
    client_max_body_size 1m;
  }

  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;    # long-lived telemetry socket; server sends heartbeats
    proxy_send_timeout 3600s;
  }

  # The OpenAPI docs are served by the backend; expose them only if you want them public.
  location /docs { proxy_pass http://backend:8000; }
  location /openapi.json { proxy_pass http://backend:8000; }

  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
